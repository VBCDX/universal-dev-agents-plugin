# CI runs on a self-hosted runner selected by the `CI_RUNNER_LABEL` repository (or
# org) variable — this keeps the runner's label out of the published source. Set
# it to a label your runner advertises (for a GitHub-parity self-hosted runner,
# `self-hosted`). If it is unset, `runs-on` evaluates to an empty string, which
# matches no runner and the jobs are silently skipped with no error. (This repo's
# own CI is unaffected: the variable is set at the org level.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Syntax check the executable
        run: node --check bin/vbcdx-dev-agents.js

      - name: Assert role descriptors are in sync with the capability table
        run: |
          node scripts/derive-roles.mjs
          if ! git diff --quiet -- assets/roles; then
            echo "role.json descriptors are out of sync with scripts/derive-roles.mjs; regenerate and commit."
            git --no-pager diff --stat -- assets/roles
            exit 1
          fi

      - name: Run tests
        run: npm test
